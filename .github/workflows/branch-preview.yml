name: Branch Preview

# Push to any branch except main -> live preview at
#   https://muzakkirsaifi123.github.io/learning_sbs/preview/<branch>/
# No PR needed. Deleting the branch removes its preview automatically.
# Merging/pushing to main is untouched by this file — that's deploy.yml.
#
# Deliberately identical to deploy.yml's validation in every way except
# where the result gets published: same quality check, same tests, same
# --strict build. A branch preview that passes here is a true preview of
# what merging to main would do, not a looser approximation of it.
#
# The workflow_run trigger below rebuilds the preview if a Notion sync
# completes for this branch -- that only happens via a manual
# workflow_dispatch against the branch (see notion_sync.yml), not
# automatically on push. An earlier version auto-triggered a sync on every
# branch push, but that was reverted as unconfirmed-working; this listener
# is left in place since it's harmless and still useful for the manual path.

on:
  push:
    branches-ignore:
      - main
      - gh-pages
  workflow_run:
    workflows: ["Sync Notion to MkDocs"]
    types:
      - completed
    branches-ignore:
      - main
      - gh-pages
  delete:

permissions:
  contents: write

jobs:
  deploy-preview:
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    concurrency:
      group: preview-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_run doesn't auto-checkout the branch that triggered
          # it (unlike push) -- has to be pointed at explicitly, the same
          # way deploy.yml points at main's HEAD via workflow_run.
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref_name }}
          fetch-depth: 0

      - name: Resolve branch name
        id: branch_ref
        run: |
          name="${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name }}"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Same hard gates as deploy.yml (main) — identical pipeline, only the
      # destination differs. A branch preview that passed these is a
      # trustworthy preview of what merging to main would actually do.
      - name: Documentation quality check
        run: python scripts/check_docs.py

      - name: Run tests
        run: python3 -m pytest tests/ -v

      - name: Build (mkdocs --strict)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mkdocs build --strict

      - name: Sanitize branch name for a URL-safe path
        id: branch
        run: |
          # printf, not echo -- echo's own trailing newline isn't in the
          # allowed charset either, so `tr` was converting it into a stray
          # trailing dash on every preview folder name.
          safe=$(printf '%s' "${{ steps.branch_ref.outputs.name }}" | tr -c 'a-zA-Z0-9._-' '-')
          echo "path=$safe" >> "$GITHUB_OUTPUT"

      - name: Deploy branch preview
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          destination_dir: preview/${{ steps.branch.outputs.path }}
          keep_files: true

      - name: Print preview URL
        run: |
          echo "### Preview deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "https://muzakkirsaifi123.github.io/learning_sbs/preview/${{ steps.branch.outputs.path }}/" >> "$GITHUB_STEP_SUMMARY"

      # No PR to comment on in this flow, so comment directly on the commit
      # that triggered the deploy — visible on its GitHub commit page.
      # Mirrors deploy.yml's comment step: resolve the right SHA depending
      # on which trigger fired.
      - name: Comment preview URL on the commit
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.eventName === "workflow_run"
              ? context.payload.workflow_run.head_sha
              : context.sha;
            const trigger = context.eventName === "workflow_run" ? "Notion sync" : "push";
            const url = `https://muzakkirsaifi123.github.io/learning_sbs/preview/${{ steps.branch.outputs.path }}/`;
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: sha,
              body: `🔍 Preview deployed (via ${trigger}) for \`${{ steps.branch_ref.outputs.name }}\`: ${url}`,
            });

  cleanup-preview:
    if: github.event_name == 'delete' && github.event.ref_type == 'branch' && github.event.ref != 'main'
    runs-on: ubuntu-latest
    # Same group naming as deploy-preview so a delete can't race a
    # still-running preview deploy for the same branch.
    concurrency:
      group: preview-${{ github.event.ref }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Remove preview for deleted branch
        run: |
          safe=$(printf '%s' "${{ github.event.ref }}" | tr -c 'a-zA-Z0-9._-' '-')
          if [ -d "preview/$safe" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git rm -rq "preview/$safe"
            git commit -m "chore: remove branch preview for deleted branch $safe"
            git push
          else
            echo "No preview/$safe directory found, nothing to clean up."
          fi
