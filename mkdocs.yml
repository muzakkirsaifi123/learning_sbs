site_name: MuZakkir's Learning Zone
site_description: Personal learning notes on Kubernetes, DevOps, and Cloud Engineering
site_url: https://muzakkirsaifi123.github.io/learning_sbs/
site_author: Saifi
copyright: Copyright &copy; 2026 Saifi

theme:
  name: material
  custom_dir: overrides
  favicon: assets/logo.svg
  logo: assets/logo.svg
  language: en

  # 3-palette system: auto (OS preference) → light → dark
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/lightbulb-auto
        name: Switch to light mode

    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: teal
      toggle:
        icon: material/lightbulb
        name: Switch to dark mode

    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: teal
      toggle:
        icon: material/lightbulb-outline
        name: Switch to system preference

  font:
    text: Inter
    code: JetBrains Mono

  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.path
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - navigation.instant
    - navigation.instant.progress
    - navigation.instant.prefetch
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.code.select
    - content.action.edit
    - content.tabs.link
    - content.tooltips
    - content.footnote.tooltips
    - toc.follow
    - announce.dismiss
    - header.autohide

  icon:
    repo: octicons/mark-github-24

repo_name: MuzOps / learning
repo_url: https://github.com/muzakkirsaifi123/learning_sbs
edit_uri: ""

hooks:
  - hooks.py

markdown_extensions:
  - admonition
  - abbr
  - attr_list
  - footnotes
  - md_in_html
  - tables
  - def_list
  - toc:
      permalink: true
      title: On this page
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.keys
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.snippets:
      base_path:
        - snippets
      check_paths: true
  - pymdownx.magiclink:
      repo_url_shorthand: true
      user: muzakkirsaifi123
      repo: learning_sbs
  - pymdownx.smartsymbols

extra:
  generator: false
  social:
    - icon: octicons/mark-github-24
      link: https://github.com/saifi
      name: GitHub
    - icon: fontawesome/brands/linkedin
      link: https://linkedin.com/in/saifi
      name: LinkedIn

extra_css:
  - assets/extra.css

extra_javascript:
  - assets/recent.js
  - assets/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Start Here: start-here.md
  - Recently Updated: recently-updated.md
  - Tags: tags.md
  - Glossary: glossary.md
  - FAQ: faq.md
  - Now: now.md
  - Kubernetes:
      - Operators:
          - Kubernetes Operator: kubernetes_operators/kubernetes_operator.md
  # BEGIN NOTION NAV — auto-generated by notion_sync.py, do not edit by hand
  - Notion:
      - Kubernetes:
          - Kubernetes: notion/kubernetes.md
          - K8sgpt: notion/kubernetes/k8sgpt.md
          - Network - Security:
              - Network - Security: notion/kubernetes/network-security.md
              - Istio and Mesh (Basic Q&A and confusion before start): notion/kubernetes/network-security/istio-and-mesh-basic-qa-and-confusion-before-start.md
              - Istio { Practice Lab - theory }: notion/kubernetes/network-security/istio-practice-lab-theory-.md
          - Kubernetes Operator:
              - Kubernetes Operator: notion/kubernetes/kubernetes-operator.md
              - Operator lab: notion/kubernetes/kubernetes-operator/operator-lab.md
      - Kafka:
          - Kafka: notion/kafka.md
          - Kafka: notion/kafka/kafka.md
      - Mongo-atlas-operator: notion/mongo-atlas-operator.md
      - Radar:
          - Radar: notion/radar.md
          - Radar-mongoatlas-flow: notion/radar/radar-mongoatlas-flow.md
      - Helm.:
          - Helm.: notion/helm.md
          - Helm Upgrade: notion/helm/helm-upgrade.md
          - How to use the helm plugin:: notion/helm/how-to-use-the-helm-plugin.md
      - Net: notion/net.md
      - keycloak: notion/keycloak.md
  # END NOTION NAV

plugins:
  - tags
  - social
  - search:
      lang: en
  - awesome-pages
  # macros must come after awesome-pages (see mkdocs-awesome-pages-plugin's
  # NavPluginOrder warning) and render_by_default is off — this site's
  # Kubernetes/Helm notes are full of Go-template `{{ .Values.x }}` snippets
  # that would otherwise be parsed as (invalid) Jinja2 macro syntax.
  - macros:
      render_by_default: false
  - privacy
  - offline
  - glightbox
  - panzoom
  - rss:
      match_path: "notion/.*"
      date_from_meta:
        as_creation: date
        as_update: last_edited_time
      categories:
        - tags
  # BEGIN NOTION REDIRECTS — auto-generated by notion_sync.py, do not edit by hand
  - redirects:
      redirect_maps: {}
  # END NOTION REDIRECTS
  - minify:
      minify_html: true
      minify_js: true
      minify_css: true
      htmlmin_opts:
        remove_comments: true
  - git-revision-date-localized:
      enable_creation_date: true
      type: timeago
  - git-committers:
      repository: muzakkirsaifi123/learning_sbs
      branch: main
      token: !ENV GITHUB_TOKEN
  # print-site must be the last plugin so it captures every other plugin's changes
  - print-site:
      add_to_navigation: false
      print_page_title: "Print this site"