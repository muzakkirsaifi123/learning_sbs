name: Bug report
description: Something on the site is broken (build, a broken link, rendering, etc.)
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What's broken
      description: What did you expect, and what actually happened? Include a URL if it's page-specific.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations:
      required: false
