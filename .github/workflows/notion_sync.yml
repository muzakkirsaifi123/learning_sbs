name: Sync Notion to MkDocs

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:
  # Same sync on feature branches as on main, triggered by a real push
  # instead of the cron (a scheduled trigger only ever runs against the
  # default branch). The bot commit this job pushes below uses the default
  # GITHUB_TOKEN, which GitHub Actions deliberately does not treat as a new
  # push for triggering purposes -- so this doesn't loop back into itself.
  push:
    branches-ignore:
      - main
      - gh-pages

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: notion-sync-${{ github.ref_name }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sync Notion → Markdown
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_PAGE_ID: ${{ secrets.NOTION_PAGE_ID }}
        run: python notion_sync.py

      - name: Regenerate knowledge graph
        run: python scripts/generate_graph.py

      - name: Documentation quality check
        run: python scripts/check_docs.py

      # Validate before committing: if the sync produced something that
      # can't build, nothing gets pushed and main stays healthy.
      - name: Validate build (mkdocs --strict)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mkdocs build --strict --site-dir /tmp/notion-sync-build-check

      - name: Commit & push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A docs/notion/ docs/assets/notion-images/ docs/assets/graph.json \
                     docs/index.md docs/recently-updated.md mkdocs.yml .notion-sync/
          git diff --cached --quiet \
            || git commit -m "chore: sync Notion pages"
          git push
