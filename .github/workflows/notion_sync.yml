name: Sync Notion to MkDocs

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sync Notion → Markdown
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_PAGE_ID: ${{ secrets.NOTION_PAGE_ID }}
        run: python notion_sync.py

      - name: Regenerate knowledge graph
        run: python scripts/generate_graph.py

      - name: Documentation quality check
        run: python scripts/check_docs.py

      # Validate before committing: if the sync produced something that
      # can't build, nothing gets pushed and main stays healthy.
      - name: Validate build (mkdocs --strict)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mkdocs build --strict --site-dir /tmp/notion-sync-build-check

      - name: Commit & push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # `git add` aborts *without staging anything* if any one of
          # multiple pathspecs matches no files -- so a single missing
          # path (e.g. no images downloaded this run) used to silently
          # block every other real change from being committed too.
          # Adding paths one at a time, skipping ones that don't exist
          # yet, means a missing path can never block the others.
          for p in docs/notion/ docs/assets/notion-images/ docs/assets/graph.json \
                   docs/index.md docs/recently-updated.md mkdocs.yml .notion-sync/; do
            [ -e "$p" ] && git add -A -- "$p"
          done
          git diff --cached --quiet \
            || git commit -m "chore: sync Notion pages"
          git push
