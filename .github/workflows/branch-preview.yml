name: Branch Preview

# Push to any branch except main -> live preview at
#   https://muzakkirsaifi123.github.io/learning_sbs/preview/<branch>/
# No PR needed. Deleting the branch removes its preview automatically.
# Merging/pushing to main is untouched by this file — that's deploy.yml.

on:
  push:
    branches-ignore:
      - main
  delete:

permissions:
  contents: write

jobs:
  deploy-preview:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Informational only for a branch preview — don't block seeing a WIP
      # branch's preview over a broken link or a failing test. Contrast
      # with deploy.yml, which treats these as hard gates before main.
      - name: Documentation quality check (non-blocking)
        run: python scripts/check_docs.py || true

      - name: Run tests (non-blocking)
        run: python3 -m pytest tests/ -v || true

      # Not --strict on purpose: a build-breaking warning here would mean
      # no site/ directory at all, and nothing to preview. main's deploy
      # (deploy.yml) is the one that stays --strict.
      - name: Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mkdocs build

      - name: Sanitize branch name for a URL-safe path
        id: branch
        run: |
          safe=$(echo "${{ github.ref_name }}" | tr -c 'a-zA-Z0-9._-' '-')
          echo "path=$safe" >> "$GITHUB_OUTPUT"

      - name: Deploy branch preview
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          destination_dir: preview/${{ steps.branch.outputs.path }}
          keep_files: true

      - name: Print preview URL
        run: |
          echo "### Preview deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "https://muzakkirsaifi123.github.io/learning_sbs/preview/${{ steps.branch.outputs.path }}/" >> "$GITHUB_STEP_SUMMARY"

  cleanup-preview:
    if: github.event_name == 'delete' && github.event.ref_type == 'branch' && github.event.ref != 'main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Remove preview for deleted branch
        run: |
          safe=$(echo "${{ github.event.ref }}" | tr -c 'a-zA-Z0-9._-' '-')
          if [ -d "preview/$safe" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git rm -rq "preview/$safe"
            git commit -m "chore: remove branch preview for deleted branch $safe"
            git push
          else
            echo "No preview/$safe directory found, nothing to clean up."
          fi
