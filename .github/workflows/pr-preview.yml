name: PR Preview Build

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: write
  pull-requests: write

jobs:
  preview:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        if: github.event.action != 'closed'
        with:
          python-version: 3.x
          cache: "pip"

      - name: Install dependencies
        if: github.event.action != 'closed'
        run: pip install -r requirements.txt

      - name: Documentation quality check
        if: github.event.action != 'closed'
        run: python scripts/check_docs.py

      - name: Run tests
        if: github.event.action != 'closed'
        run: python3 -m pytest tests/ -v

      - name: Build (mkdocs --strict)
        if: github.event.action != 'closed'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mkdocs build --strict

      # Deploys ./site to gh-pages:/pr-preview/pr-<number>/ on open/update,
      # and removes that subfolder automatically when the PR closes — the
      # live site at the root URL is untouched either way. Posts/updates a
      # PR comment with the preview link.
      - name: Deploy preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ./site
