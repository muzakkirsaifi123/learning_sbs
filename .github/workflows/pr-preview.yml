name: PR Preview Build

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Documentation quality check
        run: python scripts/check_docs.py

      - name: Run tests
        run: python3 -m pytest tests/ -v

      - name: Build (mkdocs --strict)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mkdocs build --strict

      - name: Upload built site as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-preview-${{ github.event.pull_request.number }}
          path: site/
          retention-days: 14

      - name: Comment with a link to the build
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `✅ Site built successfully. Download the preview artifact from [this workflow run](${runUrl}#artifacts) (\`site-preview-${context.issue.number}\`) and open \`index.html\` locally to review it before merging.`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.user.type === "Bot" && c.body.includes("site-preview-"));
            if (existing) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
            }
